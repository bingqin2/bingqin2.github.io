name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11 "site/**/*.html"
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir "${{ github.workspace }}/site" --no-progress "site/**/*.html"
          fail: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15 autorun --config=lighthouserc.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  container:
    name: Container and Kubernetes
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag site:ci .

      - name: Smoke test the container
        run: |
          docker run --detach --name site --publish 8080:8080 --read-only --tmpfs /tmp site:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "<title>Bingqin Wang</title>"
          curl -fsSI http://localhost:8080/assets/css/style.css | grep -i "cache-control"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing)" = "404"
          curl -s http://localhost:8080/missing | grep -q "404"
          docker logs site
          docker rm --force site

      - name: Validate manifests with kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          for dir in deploy/k8s/base deploy/k8s/overlays/ci; do
            echo "== $dir"
            kubectl kustomize "$dir" | "$RUNNER_TEMP/kubeconform" -strict -summary
          done

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Deploy to kind
        run: |
          kind load docker-image site:ci --name ci
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl rollout status deployment/bingqin-site --timeout=120s
          kubectl get deployment,pod,service,ingress

      - name: Smoke test through the Service
        run: |
          kubectl port-forward service/bingqin-site 8080:80 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "<title>Bingqin Wang</title>"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl describe pods || true
          kubectl logs deployment/bingqin-site --all-containers || true
