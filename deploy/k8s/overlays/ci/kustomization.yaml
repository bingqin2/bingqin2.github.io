# Used by the CI workflow: runs the image built in the job on a kind cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/bingqin2/bingqin2.github.io
    newName: site
    newTag: ci
patches:
  - target:
      kind: Deployment
      name: bingqin-site
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
